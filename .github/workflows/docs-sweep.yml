name: docs-sweep

on:
  pull_request:
    paths: ['skills/docs-sweep/**', '.github/workflows/docs-sweep.yml']
  push:
    branches: [main]
    paths: ['skills/docs-sweep/**', '.github/workflows/docs-sweep.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is macOS's system Python; the script promises to run there.
        python: ['3.9', '3.13']
    defaults: { run: { working-directory: skills/docs-sweep/tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} --with pytest pytest -q
